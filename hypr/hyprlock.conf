source = $HOME/.config/hypr/colors.conf

$accent = $accentcolor
$font = Caskaydia Nerd Font Propo

# GENERAL
general {
    disable_loading_bar = true
    hide_cursor = true
}

# BACKGROUND
background {
    monitor =
    path = ~/.config/backgrounds/hyprlock-bg.png
    blur_passes = 2
    color = $debug
}

