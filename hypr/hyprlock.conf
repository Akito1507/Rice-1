# USER AVATAR

image {
    monitor = 
    path = ~/.config/backgrounds/assets/pfp.png
    size = 100
    border_color = $accent

    position = 0, 75
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 7
    dots_size = 0.35
    dots_spacing = 0.35
    dots_center = true
    outer_color = $accent
    inner_color = $secondarybgcolor
    font_color = $accent
    fade_on_empty = false
    placeholder_text = 󰌾 Logged in as $USER
    hide_input = false
    check_color = $accent
    fail_color = $red
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = $yellow
    position = 0, -35
    halign = center
    valign = center
}
